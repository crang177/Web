<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

        *{
            margin: 0;
            padding: 0;
        }




        #root{
            width: 500px;
            height: 100px;   
        }

        #left{
            width: 250px;
            height: 500px;
            float: left;
            background-color: red;
        }
        #right{
            width: 250px;
            height: 500px;
            float: left;
            background-color: green;
        }
        #top{
            width: 250px;
            height: 250px;
            background-color: yellow;
        }
        #bottom{
            width: 250px;
            height: 250px;
            background-color: blue;
        }


    </style>

</head>
<body>
    <div id="root">
        <div id="left">
            <div id="top"></div>
            <div id="bottom"></div>
        </div>
        <div id="right"></div>
    </div>
</body>
</html>

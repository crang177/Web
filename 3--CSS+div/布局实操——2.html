<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

        * {
            margin: 0;
            padding: 0;
        }


        .root{
            width: 600px;
            height: 600px;
        }

        .left{
            width: 200px;
            height: 600px;
            float: left;
            background-color: pink;
        }

        .right{
            width: 400px;
            height: 600px;
            float: left;
            background-color: rgb(64, 159, 156);
        }

        .top{
            width: 400px;
            height: 300px;
            background-color: rgb(49, 128, 0);
        }
        .bottom{
            width: 400px;
            height: 300px;
        }
    
        .left_1{
            width: 200px;
            height: 300px;
            background-color: blueviolet;
            float: left;
        }
        .right_1{
            width: 200px;
            height: 300px;
            background-color: rgb(43, 226, 223);
            float: left;
        }

    </style>


</head>



<body>
    <div class="root">
        <div class="left"></div>

        <div class="right">
            <div class="top"></div>
            <div class="bottom">
                <div class="left_1"></div>
                <div class="right_1"></div>
        </div>

    </div>
</body>
</html>

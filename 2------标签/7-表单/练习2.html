<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table align="center">
        <tr>
            <td align="right">姓名:</td>
            <td>
                <form>
                    <input type="text">
                </form>  
            </td>
        </tr>
        <tr>
            <td align="right">密码:</td>
            <td>
                <form>
                    <input type="password">
                </form>  
            </td>
        </tr>
        <tr>
            <td align="right">确认密码:</td>
            <td>
                <form>
                    <input type="password">
                </form>  
            </td>
        </tr>
        <tr>
            <td align="right">密码提示问题:</td>
            <td>
                <form>
                    <select name="questions" >
                        <option value="q1">我家住在那?</option>
                        <option value="q2">我叫什么名字?</option>
                        <option value="q3">我多大?</option>
                        <option value="q4">我多重?</option>
                    </select>
                </form>
            </td>
        </tr>
        <tr>
            <td align="right" >密码提示答案:</td>
            <td>
                <form>
                    <input type="text">
                </form>  
            </td>
        </tr>
        <tr>
            <td align="right">性别:</td>
            <td>
                <form>
                    <input type="radio" name="sex" value="1">男
                    <br>
                    <input type="radio" name="sex" value="0">女
                </form>  
            </td>
        </tr>
        <tr>
            <td align="right">年龄:</td>
            <td>
                <form >
                    <input type="number" min="0" max="200">
                </form>
            </td>
        </tr>
        <tr>
            <td align="right">籍贯:</td>
            <td>
                <form>
                    <select name="sheng" >
                        <option name="l">请选择</option>
                        <option name="hubei">湖北</option>
                        <option name="guizhou">贵州</option>
                    </select>
                    省
                    <select name="shi" >
                        <option name="l">请选择</option>
                        <option name="hubei"     value="wuhan">武汉</option>
                        <option name="guizhou"   value="guiyang">贵阳</option>
                    </select>
                    市
                </form>
            </td>
        </tr>
        <tr>
            <td align="right">爱好:</td>
            <td>
                <form>
                    <input type="checkbox" name="hobby" value="1">打篮球 
                    <input type="checkbox" name="hobby" value="3">看电影
                    <input type="checkbox" name="hobby" value="4">踢足球  
                </form>
            </td>
        </tr>
        <tr>
            <td align="right">个人介绍:</td>
            <td>
                <form>
                    <textarea name="textarea" rows="4" cols="20"></textarea>
                </form>
            </td>
        </tr>
        <tr>
            <td align="right">上传头像</td>
            <td>
                <form>
                    <input type="file" name="file">
                </form>
            </td>
        </tr>
        <tr>
            <td ></td>
            <td >
                <input type="submit" value="提交">
                <input type="reset" value="重置">
            </td>
        </tr>
    </table>
</body>
</html>

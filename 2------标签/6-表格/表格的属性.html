<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <!--
        taable的属性:
            border          表格的边框，为数字，数字越大，边框的宽度越大，border="1"
            width           表格的宽度
            height          表格的高度
            align           设置表格的水平对齐方式（ledt , center , rigth）
            cellpadding     设置单元格中的内容距离边框的距离
            cellspacing     单元格之间的距离
            bgcolor         表格的背景颜色
            bordercolor     边框的颜色
            background      设置表格背景图片

    
    
    -->
    <table 
        border="1"
        width="1000px"
        height="1000px"
        align="center"
        cellpadding="50px"
        cellspacing="50px"
        bgcolor="yellow"
        bordercolor="red"
        background="./images/梦幻景观.jpg"



    >
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table 
        border="1"
        align="center"
        width="30px"
        height="30px"
        >

        <!--
            行tr的属性：
                height                一行的高度
                align                 一行中的内容的水平对齐方式（left,right,center）
                valign                一行中内容的垂直对齐方式（top,middle,bottom）
                bgcolor               一行的背景颜色
                background            一行的背景图片
        
        -->


        <tr 
         height="100px"
         align="center"
         valign="top"
         bgcolor="red"


        >
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>

        <!--
            列td的属性：
                width               一列的宽度
                height              一列的高度
                align               一列中内容的水平对齐方式（left,right,center）
                valign              一列中内容的垂直对齐方式（top,middle,bottom）
                bgcolor             一列的背景颜色
                background           一列的背景图片
        -->


        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
        <tr>
            <td>单元格</td>
            <td>单元格</td>
            <td>单元格</td>
        </tr>
    </table>
</body>
</html>

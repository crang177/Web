    <title>Document</title>

        table {
            border: 1px solid red;
            border-collapse: collapse;          /* 折叠边框，将两条实线合为一条实线 */
            text-align: center;                /* 内容水平对齐 */
        }
        td {
            padding: 100px;
            border: 1px solid red;             /* 设置边框及其颜色 */
            vertical-align: bottom;              /* 垂直对齐 */
            height: 200px; /* 添加高度 */
        }
    </style>
</head>

</html>

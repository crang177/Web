<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widt, initial-scale=1.0">
    <title>Document</title>

    <style>
        .font{
            /* 
            
                color           字体颜色
                font-size       字体大小
                font-weight     字体粗细
                font-style      字体样式：正常（normal）和斜体（italic）
                font-family     什么字体：楷体，simsum宋体等等

             */


            color: #79d31a;
            font-size: 55px;
            font-weight: 700;
            font-style: italic;
            font-family: 'simsum';
        }
    </style>
</head>
<body>
    <p class="font">节哀胆大的我觉得我的计划不确定尽快确定</p>
</body>
</html>

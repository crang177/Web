<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        /* 
            text-align           文本水平对齐方式（left，center，right）
            text-decoration      对文本进行修饰（上划线overline ，下划线underline ，删除线line-through）
            text-transform       文本字母大小写（captialize首字母大写 ，uppercase全部大写 ，lowercase全部小写）
            text-indent          文本缩进 （多少px，可以为负数，但是负数就会重合在一起）
         */

        .p1{
            text-align: center;
            text-decoration: line-through;
            text-transform: uppercase;
        }

        .p2{
            text-indent: 30px;
        }
    </style>

</head>
<body>
    <p class="p1">bjkbsdjkfbkjsdhjbajd</p>
    <p class="p2">bjkbsdjkfbkjsdhjbajd</p>
</body>
</html>

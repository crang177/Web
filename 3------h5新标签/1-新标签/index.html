<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        header {
            height: 150px;
            background-color: #abcdef;
        }

        div {
            margin-top: 10px;
            height: 300px;
        }

        section {
            height: 300px;
            background-color: #abcdef;
            width: 70%;
            float: left;
        }

        article {
            background-color: #F33;
            width: 500px;
            text-align: center;
            margin: 0px auto;
        }

        aside {
            height: 300px;
            background-color: #abcdef;
            width: 28%;
            float: right;
        }

        footer {
            height: 100px;
            background-color: #abcdef;
            clear: both;
            margin-top: 10px;
        }
    </style>



</head>

<body>
    <header>定义一个页面或是区域的头部</header>
    <nav>导航</nav>
    <div>
        <section>定义一个区域</section>
        <aside>定义页面内容的侧边框部分</aside>
    </div>
    <footer>定义一个页面或是区域的底部</footer>
</body>

</html>

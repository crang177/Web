<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .nav{
            width: 100%;
            height: 50px;
            line-height: 50px;
            background-color: gray;
        }

        .nav ul{
            width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            clear: both;
            

            
            
        }

        .nav ul li{
            list-style: none;
            float: left;
            
        }



        .nav ul li a{
            width: 40px;
            padding: 40px;
            text-decoration: none;   
            
        }

        .nav-list{
            width: 100%;
            height: 100px;
            position: absolute;
            left: 0px;
            top: 50px;
            display: none;
        }

        .nav li:hover> .nav-list{
            display: block;

        }


    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>
                <a href="#">首页</a>
                <div class="nav-list" style="background-color: red;"></div>
            </li>
            <li>
                <a href="#">手机</a>
                <div class="nav-list" style="background-color: green;"></div>
            </li>
            <li>
                <a href="#">平板</a>
                <div class="nav-list" style="background-color: blue;"></div>
            </li>
            <li>
                <a href="#">服务</a>
                <div class="nav-list" style="background-color: yellow;"></div>
            </li>
            <li>
                <a href="#">下载</a>
                <div class="nav-list" style="background-color: purple;"></div>
            </li>

        </ul>
    </div>
</body>
</html>

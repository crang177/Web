<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;

        }


/*         
        相对定位relative :
            四个属性
                left    向右移动多少px
                top     向下移动多少px
                right   向左移动多少px
                bottom  向上移动多少px
 */


        .container{
            width: 200px;
            height: 200px;
            background-color: #333;
            
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            left: 100px;
            bottom:250px;

        }
    </style>

</head>
<body>
    <div class="container"></div>
    <div class="box"></div>
</body>
</html>

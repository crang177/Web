<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /*
            使用class属性的值（类名）,使用圆点（.）进行操作
        */


        .aa{
            font-size: 44px;
        }

        .bb{
            color: blue;
        }

        .cc{
            background-color: aqua;
        }
    </style>

</head>
<body>
    <p  class="aa" >hello&nbsp;world</p>
    <h1 class="bb">你在干啥</p>
    <h2 class="cc"> 不是</p>

    <p  class="aa bb">hagjeg jkwkjasbdjka</p>  <!--一个标签使用多个类选择器-->
    <h1 class="aa cc">骄傲的把脚本的</p>
    <h2 class="aa bb cc">边防军卡号覅哦</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /*
            使用id属性的值（一般来说唯一）,使用（#）进行操作
        */


        #aa{
            font-size: 44px;
        }

        #bb{
            color: blue;
        }

        #cc{
            background-color: aqua;
        }
    </style>

</head>
<body>
    <p  id="aa" >hello&nbsp;world</p>
    <h1 id="bb">你在干啥</p>
    <h2 id="cc"> 不是</p>


    <h1 id="aacc">骄傲的把脚本的</p>
    <h2 id="aabbcc">边防军卡号覅哦</p>
</body>
</html>

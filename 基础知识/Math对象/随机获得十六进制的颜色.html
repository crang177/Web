<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            width: 1200px;
            height: 200px;
            margin: 0 auto;
            border: 1px solid red;
            background-color: getColor();
        }
    </style>
</head>
<body>
    <script>
        function getColor(){
            var cn="0123456789abcdef";
            var color="#";
            for(var i =0;i<6;i++){
                color+=cn.charAt(Math.floor(Math.random()*cn.length))
            }
            return color
        }

        console.log(getColor())
    </script>

    <div class="container"></div>
</body>
</html>

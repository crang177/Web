<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var name = "hello-world";
        var arr = name.split("-");
        var big = '', small = '';
        for (var i = 0; i < arr.length; i++) {
            big += arr[i].charAt(0).toUpperCase() + arr[i].slice(1).toLowerCase();
            if(i==0) small+=arr[i];
            else     small+=arr[i].charAt(0).toUpperCase() + arr[i].slice(1).toLowerCase();
        }
        console.log(big);
        console.log(small);
    </script>
</body>
</html>

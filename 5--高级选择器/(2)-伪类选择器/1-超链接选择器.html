<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
/* 
            :link                    链接被点击之前              ( 只适用于 a标签 )
            :visited                 链接被访问以后的            ( 只适用于 a标签 )   
            :hover                   悬停，鼠标放在标签上时的样式  ( 所有标签 )
            :active                  鼠标点击标签不松手时的样式    ( 所有标签 )   
  */


        div a:link{
            color: green;
        }


        div a:visited{
            color: rgb(34, 20, 236);
        }

        div a:hover{
            color: yellow;
        }

        div a:active{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <div>
        <a href="test.html">vccjjhvhvhvhjvj</a>
    </div>
</body>
</html>

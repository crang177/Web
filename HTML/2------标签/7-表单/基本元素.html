<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        文本框<input type="text">
        <br>


        密码框<input type="password">
        <br>


        单选按钮<input type="radio" name="sex" value="1"> 男
                <input type="radio" name="sex" value="2"> 女
        <br>


        <input type="submit" value="提交">
        <br>


        复选框<input type="checkbox" name="hobby" value="1">篮球
             <input type="checkbox" name="hobby" value="2">足球
             <input type="checkbox" name="hobby" value="3">排球
        <br>


        文件<input type="file" name="file">
        <br>


        <input type="reset" value="重置">
        <br>


        <button>我是按钮</button>
        <br>


        图片按钮<input type="image" src="https://img95.699pic.com/element/40118/4112.png_300.png!/fw/431/clip/0x300a0a0">
        <br>
    </form>


    <form>
        <label for="City_list">下拉列表:</label>
        <select id="City_list">
            
            <option >请选择城市</option>
            <option value="Chengdu">成都</option>
            <option value="Shanghai">上海</option>
            <option value="Guiyang">贵阳</option>
            <option value="Wuhan">武汉</option>
            <option value="Yantai">烟台</option>
            <option value="Jilin">吉林</option>
        </select>
    </form>

    <form>
        <label for="textarea">多行文本框</label>
        <textarea cols="30" rows="3" id="textarea"></textarea>
    </form> 


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="0" width="500" height="300" align="center">
        <tr align="center">
            <td colspan="4" >教员搜索</td>
        </tr>

        <tr align="center">
            <td >搜索类型</td>
            <td>
                <form>
                    <select>
                        <option value="0">搜索教员信息</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </form>
            </td>
            <td >教员身份</td>
            <td>
                <form>
                    <select>
                        <option value="zero">不限</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                    </select>
                </form>
            </td>
        </tr>

        <tr align="center">
            <td  >所在地区</td>
            <td  >
                <form>
                    <select>
                        <option value="none">不限</option>
                        <option value="chengdu">四川成都</option>
                        <option value="shanghai">上海</option>
                        <option value="changchun">吉林长春</option>
                        <option value="guiyang">贵州贵阳</option>
                        <option value="wuhan">湖北武汉</option>
                    </select>
                </form>
            </td>
            <td  >性别</td>
            <td  >
                <form>
                    <input type="radio" name="sex" value="1">男
                    <br>
                    <input type="radio" name="sex" value="0">女
                </form>
            </td>
        </tr>

        <tr >
            <td align="center">学习科目</td>
            <td colspan="3" >
                <form>
                    <select>
                        <option value="subject">请在以下列表中选择</option>
                        <option value="math">数学</option>
                        <option value="english">英语</option>
                        <option value="chinese">语文</option>
                        <option value="computer">计算机</option>
                    </select>
                </form>
            </td>
        </tr>

        <tr >
            <td align="center">学习</td>
            <td colspan="3">
                <form>
                    <input type="text" name="study" placeholder="请输入要学习的内容">
                </form>
            </td>
  
        </tr>

        <tr >
            <td align="center">专业</td>
            <td colspan="3">
                <form>
                    <input type="search" placeholder="请输入要学习的专业">
                    <input type="submit" value="搜索"> 
                </form>
            </td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        邮箱
        <input type="email" name="email"> 
        <input type="submit" value="提交">
        <br><br><br>

        url 
        <input type="url" name="url">
        <input type="submit" value="提交">
        <br><br><br>

        清空(搜索框)
        <input type="search"   name="search">
        <input type="submit" value="提交">
        <br><br><br>

        电话字段
        <input type="tel" name="tel">
        <input type="submit" value="提交">
        <br><br><br>

        选取颜色
        <input type="color" name="color">
        <input type="submit" value="提交">
        <br><br><br>

        输入数字的字段
        <input type="number" name="number" min="1" max="2000">
        <input type="submit" value="提交">
        <br><br><br>

        类似进度条
        <input type="range" name="range" min="1" max="100" value="20"> <!--  value  (20)是默认值 -->
        <input type="submit" value="提交">
        <br><br><br>

        日期 ( 年月日 )   (年月month)  (年周week)                  
        <input type="date" name="date" >
        <input type="submit" value="提交">
        <br><br><br>

    </form>


    <form>
        自动获取输入框的焦点 (autofocus)
        <input type="text"  name="text" autofocus>
        <input type="submit" value="提交">
        <br><br><br>

        给输入框提示词(placeholder)
        <input type="text" placeholder="用户名" name="text">
        <input type="submit" value="提交">
        <br><br><br>

        必选项 (required)
        <input type="text" name="text" placeholder="密码" required>
        <input type="submit" value="提交">

    </form>




</body>
</html>
